<!DOCTYPE html>
<html lang="tr" style="background-color: #121212; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; margin: 0; padding: 0; box-sizing: border-box;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>29 Mayıs 1453 - Gelen Öneriler</title>
    <link rel="icon" href="resimler/Gemini_Generated_Image_ecqkvpecqkvpecqk.jpg" type="image/jpeg">
</head>
<body style="margin: 0; padding: 0; background-color: #121212; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; box-sizing: border-box;">

    <header style="background-color: #1e1e1e; border-bottom: 1px solid #333333; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-sizing: border-box;">
        <div style="color: #e0f2fe; font-weight: bold; font-size: 18px; letter-spacing: 1px;">1453 İSTANBUL</div>
        
        <nav> 
            <a href="anamenü.html" style="color: #d1d5db; text-decoration: none; margin-left: 18px; font-size: 14px; padding: 5px 10px; border-radius: 4px;">Ana Menü</a>
            <a href="tarihçe.html" style="color: #d1d5db; text-decoration: none; margin-left: 18px; font-size: 14px; padding: 5px 10px; border-radius: 4px;">Tarihçe</a>
            <a href="iletişim.html" style="color: #d1d5db; text-decoration: none; margin-left: 18px; font-size: 14px; padding: 5px 10px; border-radius: 4px;">İletişim & Öneriler</a>
        </nav>
    </header>

    <div style="max-width: 900px; margin: 30px auto; padding: 0 20px; box-sizing: border-box;">
        <h2 style="color: #e0f2fe; border-bottom: 2px solid #333333; padding-bottom: 10px; margin-top: 0; font-size: 22px;">Gönderilen Görüş ve Öneriler</h2>
        
        <div id="listeAlani" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            <!-- Öneriler buraya  eklenecek -->
        </div>

        <div style="margin-top: 30px;">
            <a href="iletişim.html" style="display: inline-block; background-color: #e0f2fe; color: black; padding: 8px 18px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 14px;">← Geri Dön / Yeni Öneri Yaz</a>
        </div>
    </div>

    <footer style="text-align: center; padding: 20px; font-size: 14px; color: #6b7280; border-top: 1px solid #1a1a1a; margin-top: 40px; box-sizing: border-box;">
        WTU Dersi Performans Ödevi | 29 Mayıs 1453
    </footer>

   <script>
        const oneriler = JSON.parse(localStorage.getItem('onerilerListesi')) || [];

        listeAlani.innerHTML = oneriler.length === 0 
        <!--yazıyı aldın doluysa devam boşsa çöp oldu -->
        <!--boş için ifler eklenebilir-->
        <!--boş önceden olan yazıların gözükmesini kaldırmam lazımki bu ekran çıksın-->
        ? '<p style="color: #9ca3af; font-size: 14px;">Henüz gönderilmiş bir öneri bulunmuyor.</p>' 
        <!--dolu-->
        : oneriler.map(i => `<div style="background-color: #1a1a1a; border: 1px solid #333333; border-radius: 8px; padding: 18px;">
            <h4 style="color: #e0f2fe; margin: 0 0 8px 0; font-size: 17px;">${i.ad}
            </h4><p style="font-size: 14px; color: #d1d5db; margin: 0;">
            ${i.mesaj}</p></div>`).join('');
        <!--tek tek verilere bakdı olanı çagırdı ez-->
    </script>
</body>
</html>
